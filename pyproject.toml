[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-mcp-lite"
version = "0.8.7"
description = "Lightweight agent-native knowledge base. SQLite + FTS5 + vec0 + MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HelloTomBruce (Zhang Bei)" }]
keywords = [
  "knowledge-base",
  "mcp",
  "agent",
  "sqlite",
  "fts5",
  "vector-search",
  "semantic-search",
  "lightweight",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
  "mcp>=1.0,<2",  # MCP SDK 2.x removed mcp.server.fastmcp; kb serves only 1.x
  "python-frontmatter>=1.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# vec: install for semantic search (vec0 + pysqlite3). pysqlite3
# ships precompiled wheels for Linux x86_64/arm64 and macOS x86_64
# /arm64; it provides a SQLite build with extension support (which
# the stdlib ``sqlite3`` lacks on Python 3.12+). Without this extra
# the package still works — semantic search is silently disabled.
vec = [
  "sqlite-vec>=0.1.0",
  "pysqlite3>=0.5",
]
# v0.8: event-based file watcher (inotify on Linux, FSEvents on
# macOS, ReadDirectoryChangesW on Windows). Without this extra the
# watcher falls back to a 1s polling loop. ``watchfiles`` is a pure
# Rust extension with prebuilt wheels for the major platforms.
v0_8 = [
  "watchfiles>=0.21",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
  "mypy",
  "types-PyYAML",
  "sqlite-vec>=0.1.0",
  "pysqlite3>=0.5",
  "watchfiles>=0.21",
]

[project.scripts]
kb = "kb_mcp_lite.cli:main"

[project.urls]
Homepage = "https://github.com/HelloTomBruce/kb-mcp-lite"
Source = "https://github.com/HelloTomBruce/kb-mcp-lite"
Issues = "https://github.com/HelloTomBruce/kb-mcp-lite/issues"
Changelog = "https://github.com/HelloTomBruce/kb-mcp-lite/releases"

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["BLE001", "S110"]

[tool.coverage.run]
omit = [
  "src/kb_mcp_lite/store.py",
  "src/kb_mcp_lite/mcp_server.py",
]
relative_files = true

[tool.coverage.report]
fail_under = 70

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not benchmark'"
markers = [
    "benchmark: performance benchmarks (not run in default CI; use -m benchmark)",
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "pysqlite3",
  "sqlite_vec",
]
ignore_missing_imports = true

[tool.setuptools.package-data]
"kb_mcp_lite" = [
  "migrations/*.sql",
  "help/*.md",
  "templates/admin/*.html",
  "static/*.css",
  "static/app/**/*",
]  # Runtime assets
